name: dragonfly
description: >-
  Lite clean architecture for Flutter: repositories over dio with cache and retries, state managers,
  global events, sessions, ACL, network status, routing, forms, dialogs, translations and test helpers. Runtime of NuclearLang apps.
version: 0.1.0
repository: https://github.com/nuclearlang/dragonfly-mobile/tree/main/packages/dragonfly
homepage: https://nuclearlang.github.io
topics: [architecture, clean-architecture, bloc, dio, state-management]

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.1
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_test:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^9.3.0
  hive_ce: ^2.22.0
  go_router: ^18.1.1
  json_annotation: ^4.12.0
  mocktail: ^1.0.5
  path_provider: ^2.1.5
  web: ^1.1.1

dev_dependencies:
  flutter_lints: any
